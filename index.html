
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lab Experiments</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 25px;
        }
        .container {
            max-width: 750px;
            margin: auto;
        }
        .experiment {
            background: white;
            padding: 18px;
            margin: 12px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        a {
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            color: white;
            background: #2563eb;
        }
        .code {
            background: #374151;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>HTML Lab Experiments</h1>
    <p>View the output or inspect the source code.</p>

    <div id="experiments"></div>
</div>

<script>
const files = [
    "1Q .html", "2Q .html", "3Q .html",
    "4Q .html", "5Q .html", "6Q .html",
    "7Q .html", "8Q .html", "9Q .html",
    "10Q .html"
];

const list = document.getElementById("experiments");

files.forEach((file, index) => {
    const encodedFile = encodeURIComponent(file);
    const folder = "Questions-1-10/";

    const row = document.createElement("div");
    row.className = "experiment";

    row.innerHTML = `
        <strong>Experiment ${index + 1}</strong>
        <a href="${folder}${encodedFile}">View Output</a>
        <a class="code"
           href="https://github.com/SOLOBEAST426/CSA4308/blob/main/${folder}${encodedFile}"
           target="_blank">View Code</a>
    `;

    list.appendChild(row);
});
</script>
</body>
</html>
