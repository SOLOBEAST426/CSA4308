
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lab Experiments</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px 15px;
        }
        h1 {
            text-align: center;
            color: #172554;
        }
        .container {
            max-width: 750px;
            margin: auto;
        }
        .experiment {
            background: white;
            padding: 18px;
            margin: 14px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        a {
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 6px;
            color: white;
            background: #2563eb;
        }
        .code {
            background: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HTML Lab Experiments</h1>
        <p style="text-align:center">
            View the output or inspect the source code.
        </p>

        <div id="experiments"></div>
    </div>

    <script>
        const files = [
            "1Q .html", "2Q .html", "3Q .html",
            "4Q .html", "5Q .html", "6Q .html",
            "7Q .html", "8Q .html", "9Q .html",
            "10Q .html"
        ];

        const list = document.getElementById("experiments");

        files.forEach((file, index) => {
            const path = file.split(" ").join("%20");
            const row = document.createElement("div");
            row.className = "experiment";

            const title = document.createElement("strong");
            title.textContent = "Experiment " + (index + 1);

            const output = document.createElement("a");
            output.href = path;
            output.textContent = "View Output";

            const code = document.createElement("a");
            code.href = "https://github.com/SOLOBEAST426/CSA4308/blob/main/" + path;
            code.textContent = "View Code";
            code.className = "code";

            row.append(title, output, code);
            list.appendChild(row);
        });
    </script>
</body>
</html>
